<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>応募フォーム | AIコンサルタント</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap">
    <a href="index.html" class="logo">AI<span>Consulting</span></a>
    <nav><a href="index.html">TOPへ戻る</a></nav>
  </div>
</header>

<div class="form-wrap">
  <h2>応募・相談フォーム</h2>
  <p class="lead">必要事項をご記入ください。</p>

  <form id="apply" novalidate>
    <div class="field">
      <label for="name">お名前<span class="req">必須</span></label>
      <input type="text" id="name" name="name" autocomplete="name" required>
      <div class="error">お名前を入力してください。</div>
    </div>
    <div class="field">
      <label for="company">会社名・屋号</label>
      <input type="text" id="company" name="company" autocomplete="organization">
    </div>
    <div class="field">
      <label for="email">メールアドレス<span class="req">必須</span></label>
      <input type="email" id="email" name="email" autocomplete="email" required>
      <div class="error">正しいメールアドレスを入力してください。</div>
    </div>
    <div class="field">
      <label for="tel">電話番号</label>
      <input type="tel" id="tel" name="tel" autocomplete="tel">
    </div>
    <div class="field">
      <fieldset>
        <legend>ご相談内容（複数選択可）</legend>
        <div class="checks">
          <label><input type="checkbox" name="topic" value="戦略設計"> AI活用の戦略設計</label>
          <label><input type="checkbox" name="topic" value="PoC"> PoC・プロトタイプ</label>
          <label><input type="checkbox" name="topic" value="自動化"> エージェント・業務自動化</label>
          <label><input type="checkbox" name="topic" value="研修"> 社内定着・研修</label>
          <label><input type="checkbox" name="topic" value="その他"> その他</label>
        </div>
      </fieldset>
    </div>
    <div class="field">
      <label for="budget">ご予算の目安</label>
      <select id="budget" name="budget">
        <option value="">選択してください</option>
        <option>未定・相談したい</option>
        <option>〜30万円</option>
        <option>30〜100万円</option>
        <option>100万円以上</option>
      </select>
    </div>
    <div class="field">
      <label for="message">ご相談の詳細<span class="req">必須</span></label>
      <textarea id="message" name="message" required placeholder="現在の課題、やりたいこと、時期の希望など"></textarea>
      <div class="error">ご相談内容を入力してください。</div>
    </div>
    <div class="field">
      <label style="font-weight:400;display:flex;gap:8px;align-items:center">
        <input type="checkbox" id="agree" required> 個人情報の取り扱いに同意します<span class="req">必須</span>
      </label>
      <div class="error">同意が必要です。</div>
    </div>
    <button type="submit" class="btn">送信する</button>
    <p class="note" style="margin-top:14px">※ご記入いただいた内容は、ご連絡の目的以外には使用しません。</p>
  </form>

  <div class="thanks" id="thanks">
    <h2>送信ありがとうございました</h2>
    <p class="lead">内容を確認のうえ、ご連絡します。</p>
    <a href="index.html" class="btn ghost">TOPへ戻る</a>
  </div>
</div>

<footer>© 2026 AI Consulting</footer>

<script>
// 送信先の設定：Formspree等のURLを入れると実際に送信されます。空のままだと画面表示のみ（送信されません）。
const ENDPOINT = "https://formsubmit.co/ajax/ea157c481db28e13d22e4c385d99c8e0";

const form = document.getElementById("apply");
const check = (id, ok) => document.getElementById(id).closest(".field").classList.toggle("invalid", !ok);

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const v = (id) => document.getElementById(id).value.trim();
  const results = [
    ["name", v("name") !== ""],
    ["email", /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v("email"))],
    ["message", v("message") !== ""],
    ["agree", document.getElementById("agree").checked],
  ];
  results.forEach(([id, ok]) => check(id, ok));
  if (results.some(([, ok]) => !ok)) return;

  if (ENDPOINT) {
    try {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: { Accept: "application/json" },
        body: new FormData(form),
      });
      if (!res.ok) throw new Error();
    } catch {
      alert("送信に失敗しました。時間をおいて再度お試しください。");
      return;
    }
  }
  form.style.display = "none";
  document.getElementById("thanks").style.display = "block";
  window.scrollTo({ top: 0, behavior: "smooth" });
});
</script>
</body>
</html>
